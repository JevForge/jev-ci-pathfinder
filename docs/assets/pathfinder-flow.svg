<svg xmlns="http://www.w3.org/2000/svg" width="920" height="220" viewBox="0 0 920 220" role="img" aria-label="JEV CI Pathfinder flow">
  <title>JEV CI Pathfinder flow</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="920" height="220" rx="12" fill="url(#bg)"/>
  <text x="28" y="36" fill="#e2e8f0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600">JEV CI Pathfinder</text>
  <text x="28" y="58" fill="#94a3b8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">Allowlisted jobs in ’ typed decision out. Workflows stay under your control.</text>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
    <rect x="28" y="90" width="150" height="72" rx="8" fill="#312e81"/>
    <text x="103" y="122" text-anchor="middle" fill="#e0e7ff">Changed paths</text>
    <text x="103" y="142" text-anchor="middle" fill="#c7d2fe" font-size="11">+ config allowlist</text>

    <line x1="178" y1="126" x2="214" y2="126" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="216" y="90" width="150" height="72" rx="8" fill="#1d4ed8"/>
    <text x="291" y="122" text-anchor="middle" fill="#dbeafe">Evidence</text>
    <text x="291" y="142" text-anchor="middle" fill="#bfdbfe" font-size="11">history · monorepo</text>

    <line x1="366" y1="126" x2="402" y2="126" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="404" y="90" width="150" height="72" rx="8" fill="#7c3aed">
      <animate attributeName="opacity" values="1;0.85;1" dur="2.4s" repeatCount="indefinite"/>
    </rect>
    <text x="479" y="122" text-anchor="middle" fill="#f5f3ff">Jev decide</text>
    <text x="479" y="142" text-anchor="middle" fill="#ddd6fe" font-size="11">or deterministic</text>

    <line x1="554" y1="126" x2="590" y2="126" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="592" y="90" width="150" height="72" rx="8" fill="#0f766e"/>
    <text x="667" y="122" text-anchor="middle" fill="#ccfbf1">Policy + outputs</text>
    <text x="667" y="142" text-anchor="middle" fill="#99f6e4" font-size="11">run_jobs · skip_jobs</text>

    <line x1="742" y1="126" x2="778" y2="126" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="780" y="90" width="112" height="72" rx="8" fill="#334155"/>
    <text x="836" y="122" text-anchor="middle" fill="#f8fafc">Your CI</text>
    <text x="836" y="142" text-anchor="middle" fill="#cbd5e1" font-size="11">if: gates</text>
  </g>

  <text x="28" y="200" fill="#64748b" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">Never invents job ids. Never edits workflow files.</text>
</svg>
