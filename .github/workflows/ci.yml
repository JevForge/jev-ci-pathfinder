name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Ensure dist is present
        run: |
          test -f dist/index.js
          if ! git diff --exit-code -- dist; then
            echo "dist/ is out of date. Run npm run build and commit dist."
            exit 1
          fi
